# Ejercicio del apéndice: Odoo -> dlt -> DuckDB -> dbt -> Rill y nao
#
# Los puertos están elegidos para no chocar con los ejemplos del libro:
# Evidence usa el 3000, OpenMetadata el 8585 y el Rill del apéndice
# correspondiente el 9009. Aquí Rill se publica en el 9010, PostgreSQL en el
# 5433, dbt docs en el 8081 y nao en el 5005, de modo que este ejercicio puede
# convivir con el resto.
#
#   docker compose up -d              levanta Odoo (con datos de demostración)
#   docker compose run --rm extract   carga Odoo en DuckDB (capa bronce)
#   docker compose run --rm transform construye el Data Vault y la capa oro
#   docker compose --profile docs up -d docs   publica el linaje en el 8081
#   docker compose run --rm nao-context        construye el contexto del agente
#   docker compose --profile ai up -d nao      publica el chat en el 5005
#   docker compose down -v            lo desmonta todo

name: datalake-odoo

volumes:
  postgres_data:
  odoo_data:

networks:
  datalake:
    driver: bridge

services:

  # ---------------------------------------------------------------- origen --

  postgres:
    image: postgres:15
    container_name: dl-postgres
    environment:
      POSTGRES_DB: odoo_demo
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # 5433 en el anfitrión para no pelearse con un PostgreSQL local.
      - "5433:5432"
    networks:
      - datalake
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d odoo_demo"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Servicio de un solo uso: crea la base de datos de Odoo e instala el módulo
  # de ventas con sus datos de demostración. Sustituye al asistente web
  # "Create database", que obligaba a hacerlo a mano y no era reproducible.
  odoo-init:
    image: odoo:16
    container_name: dl-odoo-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # La imagen oficial de Odoo lee HOST, PORT, USER y PASSWORD. Con los
      # nombres POSTGRES_* que suelen copiarse de otros compose no se entera y
      # acaba buscando un servidor llamado "db".
      HOST: postgres
      PORT: 5432
      USER: odoo
      PASSWORD: odoo
    volumes:
      - odoo_data:/var/lib/odoo
    networks:
      - datalake
    command: ["odoo", "-d", "odoo_demo", "-i", "sale_management,hr", "--stop-after-init"]
    restart: "no"

  odoo:
    image: odoo:16
    container_name: dl-odoo
    depends_on:
      odoo-init:
        condition: service_completed_successfully
    environment:
      HOST: postgres
      PORT: 5432
      USER: odoo
      PASSWORD: odoo
    volumes:
      - odoo_data:/var/lib/odoo
    ports:
      - "8069:8069"
    networks:
      - datalake
    command: ["odoo", "-d", "odoo_demo", "--db-filter=odoo_demo"]
    restart: unless-stopped

  # ----------------------------------------------------------- ingesta dlt --

  # Trabajo de un solo uso. Vive tras un perfil para que "up -d" no lo dispare
  # antes de que Odoo tenga datos; se invoca con "compose run --rm extract".
  extract:
    build:
      context: .
      dockerfile: docker/toolbox.Dockerfile
    image: datalake-toolbox
    container_name: dl-extract
    profiles: ["jobs"]
    depends_on:
      postgres:
        condition: service_healthy
    user: "1000:1000"
    environment:
      ODOO_DB_HOST: postgres
      ODOO_DB_PORT: 5432
      ODOO_DB_NAME: odoo_demo
      ODOO_DB_USER: odoo
      ODOO_DB_PASSWORD: odoo
      DUCKDB_PATH: /data/warehouse.duckdb
    volumes:
      - ./warehouse:/data
      - ./pipelines:/app/pipelines
    networks:
      - datalake
    command: ["python", "/app/pipelines/odoo_extract.py"]

  # Las dos etapas anteriores en un solo proceso. dlt sabe ejecutar un proyecto
  # dbt por su cuenta, así que la dependencia "transforma solo si la carga fue
  # bien" queda expresada por el flujo del programa y no hace falta orquestador.
  #
  #   docker compose run --rm pipeline
  pipeline:
    build:
      context: .
      dockerfile: docker/toolbox.Dockerfile
    image: datalake-toolbox
    container_name: dl-pipeline
    profiles: ["jobs"]
    depends_on:
      postgres:
        condition: service_healthy
    user: "1000:1000"
    environment:
      ODOO_DB_HOST: postgres
      ODOO_DB_PORT: 5432
      ODOO_DB_NAME: odoo_demo
      ODOO_DB_USER: odoo
      ODOO_DB_PASSWORD: odoo
      DUCKDB_PATH: /data/warehouse.duckdb
      DBT_PROJECT_DIR: /app/dbt_project
    volumes:
      - ./warehouse:/data
      - ./pipelines:/app/pipelines
      - ./dbt_project:/app/dbt_project
    networks:
      - datalake
    command: ["python", "/app/pipelines/run_pipeline.py"]

  # ------------------------------------------------------ transformación dbt --

  transform:
    build:
      context: .
      dockerfile: docker/toolbox.Dockerfile
    image: datalake-toolbox
    container_name: dl-transform
    profiles: ["jobs"]
    user: "1000:1000"
    working_dir: /app/dbt_project
    environment:
      DUCKDB_PATH: /data/warehouse.duckdb
    volumes:
      - ./warehouse:/data
      - ./dbt_project:/app/dbt_project
    networks:
      - datalake
    command: ["dbt", "build"]

  # --------------------------------------------------------- documentación --

  # El sitio de documentación de dbt: el diccionario de los modelos y, sobre
  # todo, el grafo de linaje. Sirve ficheros estáticos de dbt_project/target y
  # no abre la base de datos, así que convive con Rill sin pelearse por el
  # bloqueo de DuckDB. Quien sí la abre es "dbt docs generate", que se lanza
  # aparte con el servicio "transform".
  #
  #   docker compose run --rm transform dbt docs generate
  #   docker compose --profile docs up -d docs
  docs:
    build:
      context: .
      dockerfile: docker/toolbox.Dockerfile
    image: datalake-toolbox
    container_name: dl-docs
    profiles: ["docs"]
    user: "1000:1000"
    working_dir: /app/dbt_project
    environment:
      DUCKDB_PATH: /data/warehouse.duckdb
    volumes:
      - ./warehouse:/data
      - ./dbt_project:/app/dbt_project
    ports:
      # 8081 fuera, 8080 dentro (el puerto propio de dbt docs). El 8080 del
      # anfitrión es de los más disputados, así que se publica corrido.
      - "8081:8080"
    networks:
      - datalake
    # Sin --host el servidor escucha en 127.0.0.1 dentro del contenedor y desde
    # el anfitrión no se le ve, aunque el puerto esté publicado.
    command: ["dbt", "docs", "serve", "--port", "8080", "--host", "0.0.0.0", "--no-browser"]
    restart: unless-stopped

  # ------------------------------------------------------- agente nao --

  # Construcción del contexto del agente. Trabajo de un solo uso, como
  # `extract` y `transform`, y por el mismo motivo: abre el almacén.
  #
  # Recorre la capa oro y el proyecto de dbt y deja en nao_project/ una carpeta
  # de ficheros markdown que describen lo que hay. Ese contexto es lo único que
  # el chat necesita para saber de qué va este almacén, y hay que reconstruirlo
  # cuando cambie el modelo, igual que `dbt docs generate`.
  #
  #   docker compose run --rm nao-context
  nao-context:
    build:
      context: .
      dockerfile: docker/toolbox.Dockerfile
    image: datalake-toolbox
    container_name: dl-nao-context
    profiles: ["jobs"]
    user: "1000:1000"
    working_dir: /app/project
    volumes:
      - ./warehouse:/data
      - ./nao_project:/app/project
      # De solo lectura: el contexto se construye leyendo el proyecto de dbt,
      # nunca escribiendo en él.
      - ./dbt_project:/app/dbt_project:ro
    networks:
      - datalake
    entrypoint: ["nao"]
    command: ["sync"]

  # El chat del agente. Vive tras un perfil propio y no arranca con `up -d`,
  # por la misma razón que Rill: acaba consultando el mismo fichero DuckDB.
  #
  #   docker compose --profile ai up -d nao
  nao:
    # Etiqueta fijada a propósito. El proyecto solo publica etiquetas por
    # commit (`latest`, `main`, `alpha` y el hash), así que fijar la versión
    # obliga a usar el hash: este es el 0.3.3, emparejado con la versión de
    # `nao-core` que instala la imagen de utilidades. Con `latest` bastaría con
    # que publicaran un cambio de formato para que el contexto ya construido
    # dejara de leerse.
    image: getnao/nao:b325bba
    container_name: dl-nao
    profiles: ["ai"]
    ports:
      - "5005:5005"
    environment:
      NAO_DEFAULT_PROJECT_PATH: /app/project
      NAO_CONTEXT_SOURCE: local
      # El contenedor sirve la interfaz en esta dirección y la usa para las
      # redirecciones de sesión. Sin ella, el inicio de sesión rebota.
      BETTER_AUTH_URL: http://localhost:5005
      # La clave llega del entorno del anfitrión y no se versiona. Sin ninguna
      # de las dos, la interfaz arranca igual y el agente no contesta.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # nao envía telemetría de uso a PostHog por defecto, desde el servidor y
      # desde el navegador. No es dato del almacén (son eventos del tipo
      # "mensaje enviado"), pero en un ejercicio sobre gobierno del dato
      # conviene que la decisión sea explícita y no un descubrimiento.
      POSTHOG_DISABLED: "true"
    volumes:
      - ./nao_project:/app/project
      - ./warehouse:/data
      - ./dbt_project:/app/dbt_project:ro
    networks:
      - datalake
    restart: unless-stopped

  # ------------------------------------------------------------------ bi --

  # Rill queda tras un perfil y no arranca con "up -d". El motivo es que DuckDB
  # solo admite un escritor: con Rill levantado, el contenedor de dbt no podría
  # tomar el bloqueo del fichero. El orden natural del ejercicio (cargar,
  # transformar y después explorar) evita el choque.
  #
  #   docker compose --profile bi up -d rill
  rill:
    image: rilldata/rill:latest
    container_name: dl-rill
    profiles: ["bi"]
    user: "1000:1000"
    ports:
      # 9010 fuera, 9009 dentro (el puerto propio de Rill). El 9009 del
      # anfitrión queda libre para el Rill del apéndice de exploración.
      - "9010:9009"
    volumes:
      - ./rill_project:/project
      - ./warehouse:/data
    environment:
      HOME: /tmp
    networks:
      - datalake
    entrypoint: ["rill"]
    command: ["start", "--no-open", "--pull-env=false", "--port", "9009", "/project"]
    restart: unless-stopped
