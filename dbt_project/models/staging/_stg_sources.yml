version: 2

sources:
  - name: raw
    description: >
      Capa bronce tal y como la deja dlt. Un reflejo de Odoo sin más cambio que
      el nombre de las tablas.
    schema: raw
    loaded_at_field: _extracted_at
    freshness:
      warn_after: {count: 12, period: hour}
      error_after: {count: 24, period: hour}

    tables:
      - name: raw_customers
        description: "res_partner de Odoo: clientes, proveedores y contactos."
        columns:
          - name: id
            description: "Identificador interno de Odoo."
            data_tests: [not_null, unique]
          - name: customer_rank
            description: "Mayor que cero si el contacto actúa como cliente."

      - name: raw_orders
        description: "sale_order de Odoo: cabeceras de pedido de venta."
        columns:
          - name: id
            data_tests: [not_null, unique]
          - name: partner_id
            description: "Cliente del pedido, referencia a res_partner."
          - name: state
            description: "draft, sent, sale, done o cancel."

      - name: raw_order_lines
        description: "sale_order_line de Odoo: líneas de pedido."
        columns:
          - name: id
            data_tests: [not_null, unique]
          - name: order_id
            description: "Pedido al que pertenece la línea."
          - name: product_id
            description: "Producto de la línea, referencia a product_product."

      - name: raw_products
        description: >
          product_product de Odoo, la variante concreta. No lleva ni nombre ni
          precio: ambos viven en la plantilla.
        columns:
          - name: id
            data_tests: [not_null, unique]
          - name: product_tmpl_id
            description: "Plantilla de la que cuelga la variante."

      - name: raw_product_templates
        description: >
          product_template de Odoo. Su columna `name` es JSON, porque desde la
          versión 16 los campos traducibles se guardan por idioma.
        columns:
          - name: id
            data_tests: [not_null, unique]

      - name: raw_product_categories
        description: >
          product_category de Odoo: el árbol de categorías del catálogo. Aquí
          `name` sí es texto plano, al contrario que en la plantilla.
        columns:
          - name: id
            data_tests: [not_null, unique]
          - name: complete_name
            description: "Ruta completa en el árbol, ya calculada por el origen."
          - name: parent_id
            description: "Categoría de la que cuelga. NULL en la raíz."

      - name: raw_employees
        description: >
          hr_employee de Odoo, con solo once de sus cincuenta y ocho columnas.
          El recorte no es por tamaño: el resto son datos personales de
          categoría especial que no tienen por qué salir del ERP.
        columns:
          - name: id
            data_tests: [not_null, unique]
          - name: department_id
            description: "Departamento al que pertenece. Puede venir a NULL."
          - name: user_id
            description: >
              Cuenta de Odoo asociada al empleado, si tiene. Es el único puente
              entre la plantilla y el comercial que firma un pedido.

      - name: raw_departments
        description: "hr_department de Odoo: el organigrama, en árbol."
        columns:
          - name: id
            data_tests: [not_null, unique]
          - name: manager_id
            description: >
              Responsable del departamento, referencia a hr_employee. En los
              datos de demostración viene vacío en todos.

      - name: raw_sales_teams
        description: >
          crm_team de Odoo: los equipos comerciales. Llega con el módulo de
          ventas, sin necesidad de instalar el CRM. Su `name` es JSON.
        columns:
          - name: id
            data_tests: [not_null, unique]

      - name: raw_countries
        description: >
          res_country de Odoo: el catálogo de países. Doscientas cincuenta
          filas que existen para decodificar identificadores numéricos.
        columns:
          - name: id
            data_tests: [not_null, unique]
          - name: code
            description: "Código ISO de dos letras, la clave estable de verdad."
