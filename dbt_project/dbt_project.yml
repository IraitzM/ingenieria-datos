name: 'data_vault_odoo'
version: '1.0.0'
config-version: 2

# El nombre tiene que coincidir con el del perfil declarado en profiles.yml.
# Si no coinciden, dbt aborta con "Could not find profile named ...".
profile: 'data_vault_odoo'

model-paths: ['models']
macro-paths: ['macros']
test-paths: ['tests']

# Los bloques `{% docs %}` viven en su propio directorio. Por defecto dbt los
# buscaría también dentro de models/, pero separarlos deja claro que son texto
# reutilizable y no configuración de un modelo concreto: el mismo bloque
# describe la columna `load_date` en los veinte modelos del vault.
docs-paths: ['docs']

target-path: 'target'
clean-targets:
  - 'target'
  - 'dbt_packages'

vars:
  # Sistema del que procede el dato. En un vault con varios orígenes esto deja
  # de ser una constante y pasa a resolverse por modelo.
  record_source: 'odoo_erp'

models:
  data_vault_odoo:
    # Empuja las descripciones de los YAML a los comentarios de la propia base
    # de datos (`COMMENT ON` de DuckDB), no solo al sitio de dbt docs. Se
    # comprueba así:
    #
    #   SELECT table_name, comment FROM duckdb_tables() WHERE comment IS NOT NULL;
    #
    # El motivo es que la documentación sirve donde está el dato, no donde está
    # la herramienta que la escribió: cualquier cliente SQL o catálogo que mire
    # el almacén encuentra el texto sin saber que dbt existe.
    #
    # Conviene no venderlo como más de lo que es. La versión de nao que usa
    # este ejercicio **no lee estos comentarios**: su proveedor de DuckDB saca
    # el esquema con Ibis, que no los trae, y por eso su contexto de base de
    # datos dice "No description available" aunque aquí estén. Las
    # descripciones le llegan por el otro lado, con el repositorio de dbt
    # sincronizado. Son dos caminos distintos para la misma documentación y
    # ninguna herramienta usa los dos.
    +persist_docs:
      relation: true
      columns: true

    staging:
      +materialized: view
      +schema: staging
    core:
      +materialized: table
      +schema: vault
    analytics:
      # La capa oro va al esquema `main`, declarado de forma explícita y no por
      # herencia del destino. Si se dejara al valor por defecto, bastaría con
      # ejecutar dbt desde otro perfil (por ejemplo el que genera dlt, cuyo
      # esquema es el del dataset) para que estas tablas cambiasen de sitio y
      # el panel dejase de encontrarlas.
      +schema: main
      # El motivo de que sea `main` y no un esquema propio:
      # Rill solo sabe direccionar tablas del esquema por defecto de la base de
      # datos que adjunta: sus claves `database` y `database_schema` se ignoran
      # con este conector, de modo que una tabla en un esquema `analytics` es
      # invisible para el panel. Las capas de abajo (raw, staging, vault) sí
      # van en su propio esquema porque solo las consume dbt.
