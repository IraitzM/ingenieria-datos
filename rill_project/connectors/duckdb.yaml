# Conexión al almacén que dejaron dlt y dbt.
#
# El fichero tiene que llamarse `duckdb.yaml`, porque el nombre del conector es
# el del fichero y es el que se declara como `olap_connector` en rill.yaml.
#
# Rill no copia nada: consulta el mismo fichero DuckDB que acaba de construir
# dbt, así que no hay una segunda versión de la verdad que mantener.
#
# `mode: read` evita que Rill escriba en el almacén, y eso decide con quién
# puede convivir. DuckDB admite **varios lectores a la vez, pero un solo
# escritor**: con Rill levantado, `nao sync` entra sin problema porque también
# abre en solo lectura, mientras que dbt falla con un "Conflicting lock is
# held" en cuanto intenta reconstruir algo.
#
# Por eso Rill vive tras un perfil de Compose y el orden del ejercicio es
# cargar, transformar y solo entonces explorar: lo que no puede solaparse es la
# escritura, no la lectura.

type: connector
driver: duckdb
path: /data/warehouse.duckdb
mode: read
