# Panel de exploración de ventas.
#
# Es corto porque las métricas y las dimensiones ya están definidas en la capa
# semántica; aquí solo se decide qué se expone. El `"*"` vale para un ejercicio,
# pero en un proyecto real conviene enumerar lo que se quiere enseñar.
#
# Lo que sí se decide aquí es con qué se abre el panel. Sin `defaults`, Rill
# elige por su cuenta y quien entra se encuentra una pantalla distinta cada
# vez; con ellos, el panel tiene una portada.

version: 1
type: explore
display_name: "Ventas"

metrics_view: ventas

dimensions: "*"
measures: "*"

defaults:
  measures:
    - facturacion
    - pedidos
    - ticket_medio
  dimensions:
    - comercial
    - departamento
    - cliente
  time_range: P3M
