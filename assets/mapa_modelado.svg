    .lugar       { font-size: 13px; font-weight: bold; }
    .fecha       { font-size: 10.5px; font-style: italic; fill: #6b5943; }
    .mar         { font-size: 12.5px; font-style: italic; fill: #5b8494; letter-spacing: 2px; }
    .chiste      { font-size: 11px; font-style: italic; fill: #7a5a3c; }
    .futuro      { fill: #f2f6ff; }
    .futurofecha { fill: #c3cfef; }
  </style>

