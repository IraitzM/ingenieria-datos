<svg viewBox="0 0 1200 790" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mapaTitulo mapaDesc">
  <title id="mapaTitulo">Mapamundi del modelado de datos</title>
  <desc id="mapaDesc">Mapa cómico donde las técnicas de modelado de datos aparecen como territorios ordenados de oeste a este por antigüedad. Al oeste, las Tierras Primigenias con el Volcán Jerárquico (IMS, 1966) y la Ciénaga CODASYL (modelo en red, 1969). En el centro, el Continente Relacional con la Cordillera de Codd (1970), el Valle de las Formas Normales, la Ciudadela de Inmon (1990), la Constelación de Kimball (1996) y la Sierra Copo de Nieve. Al este, el Archipiélago Ensemble con la Fortaleza Data Vault, los Fiordos del Ancla (Suecia, 2004), el Cabo Focal y la Isla Bicéfala (Head and Version). En el extremo oriental, la Frontera Futura con las Islas Flotantes de la Malla (2019), la Vía Activity Schema (2020), la Megatorre Tablón y el Puente de Puppini (2020). Una línea temporal en la base va de 1966 a hoy.</desc>

  <defs>
    <filter id="wobble" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.016" numOctaves="2" seed="11" result="ruido"/>
      <feDisplacementMap in="SourceGraphic" in2="ruido" scale="6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="wobbleSuave" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="2" seed="4" result="ruido2"/>
      <feDisplacementMap in="SourceGraphic" in2="ruido2" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <linearGradient id="cieloFuturo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#463a66"/>
      <stop offset="100%" stop-color="#6b5f90"/>
    </linearGradient>
    <linearGradient id="lava" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f4a13c"/>
      <stop offset="100%" stop-color="#c2381f"/>
    </linearGradient>
    <radialGradient id="neon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5ee8e0" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#5ee8e0" stop-opacity="0"/>
    </radialGradient>
  </defs>

